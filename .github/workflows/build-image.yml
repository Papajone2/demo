name: Build Pi Zero W image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-zero-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run regression tests before building
        run: |
          python -m pip install -r requirements.txt
          PYTHONPATH=device python -m unittest discover -s tests -v
          node --test tests/serial.test.mjs
          bash -n image/build.sh image/usb-gadget.sh
          PYTHONPATH=device python docs/render_screens.py
      - name: Install privileged image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support parted dosfstools e2fsprogs xz-utils
          sudo update-binfmts --enable qemu-arm
          test -x /usr/bin/qemu-arm-static
      - name: Build original Zero W-compatible image
        run: sudo env GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" bash image/build.sh
      - name: Upload compressed image and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: satooshi-firmware-0.3.0-image-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
