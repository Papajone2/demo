name: Device tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=device python -m unittest discover -s tests -v
      - run: node --test tests/serial.test.mjs
      - run: bash -n image/build.sh image/usb-gadget.sh
