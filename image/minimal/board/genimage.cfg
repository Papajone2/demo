image boot.vfat {
  vfat {
    file bootcode.bin { image = "rpi-firmware/bootcode.bin" }
    file start_cd.elf { image = "rpi-firmware/start_cd.elf" }
    file fixup_cd.dat { image = "rpi-firmware/fixup_cd.dat" }
    file config.txt { image = "rpi-firmware/config.txt" }
    file cmdline.txt { image = "rpi-firmware/cmdline.txt" }
    file zImage { image = "zImage" }
    file bcm2708-rpi-zero-w.dtb { image = "bcm2708-rpi-zero-w.dtb" }
    file "overlays/dwc2.dtbo" { image = "rpi-firmware/overlays/dwc2.dtbo" }
  }
  size = 64M
}
image data.ext4 {
  empty = true
  ext4 { label = "SATOOSHI_DATA" }
  size = 64M
}
image satooshi-minimal.img {
  hdimage { }
  partition boot {
    partition-type = 0x0C
    bootable = "true"
    image = "boot.vfat"
    offset = 1M
  }
  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext2"
  }
  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
