name: Build minimal Pi Zero W image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-zero-minimal-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare build host
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl rsync cpio unzip bc file \
            wget python3 python3-dev python3-pip qemu-user-static binfmt-support \
            libncurses-dev libssl-dev xz-utils
      - name: Host wallet regression checks
        run: |
          cargo build --locked --release --manifest-path native-sr25519/Cargo.toml
          python3 -m pip install --break-system-packages -r requirements.txt
          SATOOSHI_SR25519_LIB="$PWD/native-sr25519/target/release/libsatooshi_sr25519.so" \
            PYTHONPATH=device python3 -m unittest discover -s tests -v
          node --test tests/serial.test.mjs
          python3 -m unittest discover -s image/minimal/tests -p 'test_*.py' -v
      - name: Cross-build minimal appliance and verify ARM runtime
        run: bash image/minimal/build.sh
      - name: Upload uniquely named minimal image and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: satooshi-minimal-image-${{ github.run_number }}
          path: dist-minimal/
          if-no-files-found: error
          retention-days: 14
